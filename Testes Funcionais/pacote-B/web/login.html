<meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:18px system-ui;max-width:850px;margin:50px auto;padding:0 24px;color:#173247}label{display:block;margin:18px 0}input,select,button{font:inherit;padding:8px}input{display:block;width:360px}button{cursor:pointer}li{margin:12px 0}#erro{color:#a51f2b}#sucesso{color:#11643b}</style><title>Login</title><h1>Acesso do aluno</h1><form id="login"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="senha" type="password" required></label><button id="entrar">Entrar</button></form><p id="erro" role="alert"></p><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,senha:document.querySelector('#senha').value})});if(r.ok)location.href='/painel';else document.querySelector('#erro').textContent=(await r.json()).erro;};</script>
