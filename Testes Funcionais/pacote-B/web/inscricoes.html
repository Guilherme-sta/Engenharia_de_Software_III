<meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:18px system-ui;max-width:850px;margin:50px auto;padding:0 24px;color:#173247}label{display:block;margin:18px 0}input,select,button{font:inherit;padding:8px}input{display:block;width:360px}button{cursor:pointer}li{margin:12px 0}#erro{color:#a51f2b}#sucesso{color:#11643b}</style><title>Inscrições</title><h1>Inscrição em minicursos</h1><form id="inscrever" novalidate><label>Nome<input id="nome"></label><label>E-mail<input id="email"></label><label>Curso<select id="curso"><option value="">Selecione</option><option value="1">Python</option><option value="2">Java</option><option value="3">Testes de Software</option></select></label><button id="confirmar">Confirmar inscrição</button></form><p id="erro" role="alert"></p><p id="sucesso" role="status"></p><h2>Inscrições realizadas</h2><ul id="lista"></ul><script>
async function listar(){const r=await fetch('/api/inscricoes');const d=await r.json();const lista=document.querySelector('#lista');lista.replaceChildren();for(const item of d.itens){const li=document.createElement('li');li.dataset.id=item.id;li.textContent=item.nome+' / '+item.email+' / curso '+item.curso+' ';const b=document.createElement('button');b.textContent='Cancelar';b.dataset.testid='cancelar-'+item.id;b.onclick=async()=>{await fetch('/api/inscricoes/'+item.id,{method:'DELETE'});document.querySelector('#sucesso').textContent='Inscrição cancelada';await listar();};li.append(b);lista.append(li);}}
document.querySelector('#inscrever').onsubmit=async e=>{e.preventDefault();document.querySelector('#erro').textContent='';document.querySelector('#sucesso').textContent='';const r=await fetch('/api/inscricoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:document.querySelector('#nome').value,email:document.querySelector('#email').value,curso:Number(document.querySelector('#curso').value)})});const d=await r.json();if(r.ok){document.querySelector('#sucesso').textContent='Inscrição realizada';await listar();}else document.querySelector('#erro').textContent=d.erro;};listar();</script>
